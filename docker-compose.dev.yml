# Local dev only — do not deploy this file to the hive lab.
# Run: bash scripts/setup-dev.sh

services:
  streamerkit:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./.cache:/app/.cache
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      - VITE_PROXY_TARGET=http://streamerkit:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - backend

networks:
  backend:
